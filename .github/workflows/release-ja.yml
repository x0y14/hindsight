# Overlay-only release for x0y14/hindsight.
# Publishes the slim API image to GHCR. No PyPI, npm, Helm, CLI, or other images.
name: Release JA Overlay

on:
  push:
    tags:
      # SemVer + -ja only (not bare vX.Y.Z).
      - 'v*.*.*-ja'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing overlay tag to rebuild (e.g. v0.9.1-ja)'
        required: true
        type: string
      update_latest:
        description: 'Also push latest-slim (only for the current intended head line)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Version-keyed so dispatch-from-main and tag-push cannot race latest-slim.
  group: release-ja-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    if: github.repository == 'x0y14/hindsight'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.out.outputs.VERSION }}
      update_latest: ${{ steps.out.outputs.UPDATE_LATEST }}
      checkout_ref: ${{ steps.out.outputs.CHECKOUT_REF }}
      sign: ${{ steps.out.outputs.SIGN }}
    steps:
      - name: Refuse unexpected owner
        run: |
          set -euo pipefail
          if [ "${{ github.repository_owner }}" != "x0y14" ]; then
            echo "Refusing publish: owner is ${{ github.repository_owner }}, expected x0y14"
            exit 1
          fi

      - name: Resolve tag-push
        id: tag_push
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "Tag push required; got ${{ github.ref }}"
            exit 1
          fi
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ja$ ]]; then
            echo "Invalid overlay version: $VERSION (expected X.Y.Z-ja)"
            exit 1
          fi
          SHA="${{ github.sha }}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid github.sha: $SHA"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "UPDATE_LATEST=true" >> "$GITHUB_OUTPUT"
          echo "CHECKOUT_REF=$SHA" >> "$GITHUB_OUTPUT"
          echo "SIGN=true" >> "$GITHUB_OUTPUT"

      - name: Validate dispatch tag input
        id: validate_tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ja$ ]]; then
            echo "Invalid tag for dispatch: $TAG (expected vX.Y.Z-ja)"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout overlay tag (immutable peel)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.validate_tag.outputs.TAG }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve dispatch peeled SHA
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          UPDATE_LATEST: ${{ inputs.update_latest }}
          VERSION: ${{ steps.validate_tag.outputs.VERSION }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Failed to peel tag to commit SHA: $SHA"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "UPDATE_LATEST=$UPDATE_LATEST" >> "$GITHUB_OUTPUT"
          echo "CHECKOUT_REF=$SHA" >> "$GITHUB_OUTPUT"
          echo "SIGN=false" >> "$GITHUB_OUTPUT"

      - name: Export guard outputs
        id: out
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ steps.dispatch.outputs.VERSION }}" >> "$GITHUB_OUTPUT"
            echo "UPDATE_LATEST=${{ steps.dispatch.outputs.UPDATE_LATEST }}" >> "$GITHUB_OUTPUT"
            echo "CHECKOUT_REF=${{ steps.dispatch.outputs.CHECKOUT_REF }}" >> "$GITHUB_OUTPUT"
            echo "SIGN=${{ steps.dispatch.outputs.SIGN }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ steps.tag_push.outputs.VERSION }}" >> "$GITHUB_OUTPUT"
            echo "UPDATE_LATEST=${{ steps.tag_push.outputs.UPDATE_LATEST }}" >> "$GITHUB_OUTPUT"
            echo "CHECKOUT_REF=${{ steps.tag_push.outputs.CHECKOUT_REF }}" >> "$GITHUB_OUTPUT"
            echo "SIGN=${{ steps.tag_push.outputs.SIGN }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved VERSION=$(grep VERSION "$GITHUB_OUTPUT" | cut -d= -f2-) CHECKOUT_REF=$(grep CHECKOUT_REF "$GITHUB_OUTPUT" | cut -d= -f2-)"

  test:
    name: Test (deterministic)
    needs: [guard]
    runs-on: ubuntu-latest
    if: github.repository == 'x0y14/hindsight'
    defaults:
      run:
        working-directory: hindsight-api-slim
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.checkout_ref }}
          persist-credentials: false

      - name: Assert workflows allowlist
        working-directory: .
        run: |
          set -euo pipefail
          # Deleted upstream workflows (must stay absent; sibling workflows would still run on tag push):
          # deploy-docs.yml perf-test.yml release-integration.yml release-tool.yml release.yml
          # sign-images.yml star-history.yml test.yml windows-smoke.yml
          mapfile -t FILES < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)
          if [ "${#FILES[@]}" -ne 1 ] || [ "${FILES[0]}" != "release-ja.yml" ]; then
            echo "Refusing release: .github/workflows must contain only release-ja.yml"
            printf ' found: %s\n' "${FILES[@]:-}"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen --extra embedded-db --extra ja-morph --index-strategy unsafe-best-match

      - name: Run Japanese temporal / query analyzer tests
        # No LLM provider secrets. Exclude judge / matrix / slow marks.
        run: |
          uv run pytest tests/test_query_analyzer.py tests/test_temporal_extraction.py \
            tests/test_japanese_morph_snapshot.py \
            -v -m "not hs_llm_mat and not hs_llm_core and not slow"

  build-and-push:
    name: Build and push slim API
    needs: [guard, test]
    runs-on: ubuntu-latest
    if: github.repository == 'x0y14/hindsight' && needs.test.result == 'success'
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      UPDATE_LATEST: ${{ needs.guard.outputs.update_latest }}
      CHECKOUT_REF: ${{ needs.guard.outputs.checkout_ref }}
    outputs:
      digest: ${{ steps.digest.outputs.DIGEST }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.guard.outputs.checkout_ref }}
          persist-credentials: false

      - name: Assert workflows allowlist
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' | sort)
          if [ "${#FILES[@]}" -ne 1 ] || [ "${FILES[0]}" != "release-ja.yml" ]; then
            echo "Refusing release: .github/workflows must contain only release-ja.yml"
            printf ' found: %s\n' "${FILES[@]:-}"
            exit 1
          fi

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build slim image (load for probe)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/standalone/Dockerfile
          target: api-only
          build-args: |
            INCLUDE_LOCAL_MODELS=false
            PRELOAD_ML_MODELS=false
          push: false
          load: true
          platforms: linux/amd64
          tags: hindsight-api:ja-probe
          labels: |
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.revision=${{ needs.guard.outputs.checkout_ref }}
          cache-from: type=gha

      - name: In-image Japanese temporal probe
        run: |
          set -euo pipefail
          # stdin avoids host mount permission issues with non-root image users.
          # Probe is amd64 only (same as the load step). Morph Tagger() is also
          # amd64-only here; do not treat a skipped arm64 probe as coverage.
          docker run --rm -i --entrypoint python hindsight-api:ja-probe - <<'PY'
          from datetime import datetime
          from fugashi import Tagger
          from hindsight_api.engine.japanese_temporal_periods import extract_japanese_period
          from hindsight_api.engine.temporal_periods import extract_period

          # Construct Tagger, not a mere import — missing UniDic would otherwise pass.
          Tagger()

          ref = datetime(2024, 6, 15, 12, 0, 0)

          for query in ("先週", "一昨日", "来月"):
              ja = extract_japanese_period(query, ref)
              assert ja is not None, f"JA miss: {query!r}"
              routed = extract_period(query, ref)
              assert routed is not None, f"router miss: {query!r}"
              assert routed == ja, f"router/JA mismatch for {query!r}: {routed!r} vs {ja!r}"

          result = extract_period("昨日の会議", ref)
          assert result is not None, "昨日の会議 must extract"

          natural = extract_period("先週何について考えてた？", ref)
          assert isinstance(natural, tuple), f"先週何について考えてた？ must be DateRange, got {natural!r}"
          assert extract_period("きのうえに猫がいる", ref) is None, "きのうえに猫がいる must not extract"

          print("in-image JA probe ok")
          PY

      - name: Drop probe image before multi-arch push
        run: docker rmi hindsight-api:ja-probe || true

      - name: Push version tag
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/standalone/Dockerfile
          target: api-only
          build-args: |
            INCLUDE_LOCAL_MODELS=false
            PRELOAD_ML_MODELS=false
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/x0y14/hindsight-api:${{ needs.guard.outputs.version }}-slim
          labels: |
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.revision=${{ needs.guard.outputs.checkout_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect \
            "ghcr.io/x0y14/hindsight-api:${VERSION}-slim" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid digest: $DIGEST"
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published ghcr.io/x0y14/hindsight-api:${VERSION}-slim@$DIGEST"

      - name: Alias latest-slim to the signed index
        if: needs.guard.outputs.update_latest == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.DIGEST }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/x0y14/hindsight-api:latest-slim" \
            "ghcr.io/x0y14/hindsight-api:${VERSION}-slim@${DIGEST}"

      - name: Create or update GitHub Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.DIGEST }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          BASE="${VERSION%-ja}"
          NOTES_FILE=$(mktemp)

          {
            echo "## Summary"
            echo ""
            echo "Upstream **v${BASE}** plus Japanese temporal period extraction for recall."
            echo ""
            echo "Base: [\`v${BASE}\`](https://github.com/vectorize-io/hindsight/releases/tag/v${BASE})"
            echo ""
            echo "### Changes vs v${BASE}"
            echo ""
            echo "- Add \`japanese_temporal_periods.py\` so recall parses closed Japanese compounds (\`先週\` / \`来月\` / \`一昨日\` / kana aliases) before Chinese rules and the English-only dateparser scorer."
            echo "- Matching contract aligned with Chinese: recurring → open/since → closed longest-first; \`中\`/\`内\` as stem suffixes; short \`曜\` covered."
            echo "- Japanese token independence uses UniDic character bounds (fugashi + unidic-lite extra \`ja-morph\`), not a one-character follower whitelist."
            echo "- Minimal Chinese patches for shared forms (\`昨日の会議\`, \`(?<!一)昨日\`)."
            echo "- Image bundles UniDic-lite (BSD-2-Clause) via the \`ja-morph\` extra. The dictionary is **not** vendored into \`hindsight_api/\`; keep the installed package \`LICENSE\`. See the unidic-lite distribution license."
            echo ""
            echo "This is a fork overlay release (\`x0y14/hindsight\`), not an upstream PyPI/npm cut."
            echo ""
            echo "### Container image"
            echo ""
            echo "- Image: \`ghcr.io/x0y14/hindsight-api:${VERSION}-slim@${DIGEST}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\` (JA probe and morph Tagger() probe run on amd64 only)"
            echo "- Revision: \`${CHECKOUT_REF}\`"
            if [ "${UPDATE_LATEST}" = "true" ]; then
              echo "- Also tagged: \`ghcr.io/x0y14/hindsight-api:latest-slim\` (same index digest)"
            fi
            echo ""
            echo "### Deploy note"
            echo ""
            echo "This is **\`hindsight-api\`** (\`api-only\` slim), not standalone \`hindsight\` (API+UI). Do **not** helm-install or compose from this fork tree as-is: chart/compose defaults still point at \`ghcr.io/vectorize-io/hindsight\`. Override the image to \`ghcr.io/x0y14/hindsight-api:${VERSION}-slim\` (or pin the digest above)."
          } > "$NOTES_FILE"

          # Tag deletion can leave a draft/untagged release; always publish.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=false --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$TAG" --draft=false --notes-file "$NOTES_FILE"
          fi

  sign:
    name: Sign image digest
    needs: [guard, build-and-push]
    runs-on: ubuntu-latest
    # Tag-push only: dispatch signatures must not be a trusted identity.
    if: >-
      github.repository == 'x0y14/hindsight' &&
      needs.guard.outputs.sign == 'true' &&
      needs.build-and-push.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      DIGEST: ${{ needs.build-and-push.outputs.digest }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign digest
        run: |
          set -euo pipefail
          REF="ghcr.io/x0y14/hindsight-api@${DIGEST}"
          cosign sign --yes "$REF"

      - name: Verify signature
        run: |
          set -euo pipefail
          REF="ghcr.io/x0y14/hindsight-api@${DIGEST}"
          cosign verify "$REF" \
            --certificate-identity-regexp '^https://github\.com/x0y14/hindsight/\.github/workflows/release-ja\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-ja$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
